name: ساخت اپ کاریا تلفن

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: گرفتن کد
        uses: actions/checkout@v4

      - name: نصب جاوا ۲۱
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: نصب ابزارهای اندروید
        uses: android-actions/setup-android@v3

      - name: نصب پلتفرم مورد نیاز پروژه
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: بازسازی کلید امضا از محرمانه‌ها
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/bc-android.keystore
          ls -l app/bc-android.keystore
          cat > keystore.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=bc-android.keystore
          EOF

      - name: آماده‌سازی gradlew
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: ساخت نسخه نهایی
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: پاک‌کردن کلید از ماشین ساخت
        if: always()
        run: rm -f app/bc-android.keystore keystore.properties

      - name: فهرست و اندازه خروجی
        if: always()
        run: find app/build/outputs -name "*.apk" -exec ls -lh {} \; || true

      - name: بارگذاری APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kariya-phone-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: بارگذاری گزارش خطا
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
