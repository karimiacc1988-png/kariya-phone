name: ساخت اپ کاریا تلفن

on:
  workflow_dispatch:
  push:
    branches: [ main, rework ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: گرفتن کد
        uses: actions/checkout@v4

      - name: نصب جاوا ۲۱
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: نصب ابزارهای اندروید
        uses: android-actions/setup-android@v3

      - name: نصب پلتفرم مورد نیاز پروژه
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: بازسازی کلید امضا از محرمانه‌ها
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/bc-android.keystore
          ls -l app/bc-android.keystore
          cat > keystore.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=bc-android.keystore
          EOF

      - name: آماده‌سازی gradlew
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: ساخت نسخه نهایی
        # شماره‌ی اجرا داخل اپ نوشته می‌شود تا همیشه معلوم باشد روی گوشی کدام
        # بیلد نصب است.
        run: ./gradlew :app:assembleRelease -PkariyaBuild=${{ github.run_number }} --stacktrace --no-daemon

      - name: پاک‌کردن کلید از ماشین ساخت
        if: always()
        run: rm -f app/bc-android.keystore keystore.properties

      - name: فهرست و اندازه خروجی
        if: always()
        run: find app/build/outputs -name "*.apk" -exec ls -lh {} \; || true

      - name: بارگذاری APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kariya-phone-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # آپلود از ماشین کار به سرور حدود ده دقیقه طول می‌کشید؛ از این‌جا چند ثانیه
      # است. کلید روی سرور به یک دستور قفل است (فقط همین فایل را در پوشه‌ی CDN
      # می‌نشاند) و اگر ارسال نیمه‌کاره بماند، نسخه‌ی زنده دست‌نخورده می‌ماند.
      - name: انتشار روی CDN
        if: success()
        # ⚠️ این مرحله دو بار پشت سر هم شکست خورد و علتش را پیدا کردیم: لینک SSH
        # این سرور وسط ارسال می‌افتد و ۵۶ مگابایت هیچ‌وقت یک‌نفس رد نمی‌شود.
        # تلاش دوباره هم کمکی نمی‌کرد چون هر تلاش از صفر شروع می‌شد.
        #
        # حالا فایل تکه‌تکه می‌رود؛ هر تکه اتصال خودش را دارد، پس افتادن لینک
        # فقط همان تکه را می‌سوزاند نه کل کار را. سمت سرور
        # `/usr/local/bin/kariya-apk-receive` تکه‌ها را نگه می‌دارد و در پایان
        # می‌چسباند و چکسام را می‌سنجد.
        #
        # مهلت و continue-on-error سر جایشان می‌مانند: APK از قبل به‌عنوان
        # artifact ذخیره شده، پس شکست این مرحله چیزی را از دست نمی‌دهد.
        timeout-minutes: 12
        continue-on-error: true
        env:
          DEPLOY_KEY: ${{ secrets.APK_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.APK_DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/apk_deploy
          chmod 600 ~/.ssh/apk_deploy
          ssh-keyscan -p 23 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "فرستادن $(basename "$APK") ($(stat -c%s "$APK") بایت)"

          rm -rf parts && mkdir parts
          split -b 4194304 -d -a 3 "$APK" parts/p
          COUNT=$(ls parts | wc -l)
          echo "$COUNT تکه‌ی چهار مگابایتی"

          send() {
            ssh -i ~/.ssh/apk_deploy -p 23 -o BatchMode=yes \
                -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
                "kariya-apk@$DEPLOY_HOST" "$1"
          }

          FAILED=0
          INDEX=0
          for part in parts/p*; do
            for try in 1 2 3 4; do
              if send "part $INDEX" < "$part"; then break; fi
              if [ "$try" = 4 ]; then
                echo "::warning::تکه $INDEX بعد از ۴ تلاش نرفت"
                FAILED=1
              fi
              sleep 5
            done
            INDEX=$((INDEX + 1))
          done

          if [ "$FAILED" = 0 ] && send "assemble $COUNT $SUM" < /dev/null; then
            echo "منتشر شد"
          else
            echo "::warning::انتشار روی CDN نشد؛ APK در artifact هست"
          fi
          rm -f ~/.ssh/apk_deploy

      - name: بارگذاری گزارش خطا
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
